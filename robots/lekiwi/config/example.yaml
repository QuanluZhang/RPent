# Example LeKiwi site configuration. Copy to a machine-specific YAML and
# pass it with --robot-config / --robot-config.

robot:
  # Serial bus of the Feetech STS3215 servo board.
  port: /dev/ttyACM0
  wheel_radius: 0.05
  base_radius: 0.125
  max_raw: 3000

cameras:
  devices:
    front:
      # UVC serial of the front camera (ls /dev/v4l2/by-id or `v4l2-ctl --list-devices`).
      serial: "<front-camera-serial>"
      type: webcam
      main: true

drive:
  step_frequency: 10.0
  max_linear_velocity: 0.3
  max_angular_velocity: 60.0
  frame_size: [128, 128]
